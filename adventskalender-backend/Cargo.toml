[package]
name = "adventskalender-backend"
version = "2024.12.1"
edition = "2021"
authors = ["Tim Janke <tim+github@janke.biz>"]
description = "A simple tool for organizing a christmas raffle (like a advent calendar)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/flying7eleven/adventskalender"
exclude = [".github/", ".gitignore"]
build = "build.rs"
publish = false
rust-version = "1.88"

[badges]
maintenance = { status = "actively-developed" }

[dependencies.lazy_static]
version = "1.5.1"
default-features = false

[dependencies.rocket]
version = "0.5.2"
default-features = false
features = ["json"]

[dependencies.chrono]
version = "0.4.45"
default-features = false
features = ["clock", "serde"]

[dependencies.log]
version = "0.4.35"
default-features = false

[dependencies.fern]
version = "0.7.1"
default-features = false

[dependencies.rand]
version = "0.10.3"
default-features = false
features = ["thread_rng"]

[dependencies.serde]
version = "1.0.229"
default-features = false

[dependencies.diesel]
version = "2.3.14"
default-features = false
features = ["postgres", "r2d2", "chrono"]

[dependencies.diesel_migrations]
version = "2.3.2"
default-features = false

[dependencies.dashmap]
version = "6.2.1"
default-features = false

[dependencies.bcrypt]
version = "0.19.3"
default-features = false
features = ["std"]

[dependencies.http]
version = "1.5.0"
default-features = false
features = ["std"]

[dependencies.jsonwebtoken]
version = "11.1.0"
default-features = false
features = ["rust_crypto", "use_pem"]

[dependencies.regex]
version = "1.13.1"
default-features = false

[dependencies.ring]
version = "0.17.14"
default-features = false
features = ["std"]

[dependencies.unicase]
version = "2.10.0"
default-features = false

[dependencies.url]
version = "2.5.8"
default-features = false

[build-dependencies.vergen]
version = "10.0.3"
default-features = false
features = ["build", "cargo", "rustc"]

[build-dependencies.vergen-git2]
version = "10.0.3"
default-features = false

[dependencies.r2d2]
version = "0.8.10"
default-features = false

[dependencies.cookie]
version = "0.18"
default-features = false
features = ["secure", "private"]

[dependencies.time]
version = "0.3"
default-features = false

[dependencies.base64]
version = "0.23"
default-features = false
features = ["std"]

[dependencies.healthchecks]
version = "3.3.0"
default-features = false

[dependencies.passwords]
version = "3.1.19"
default-features = false
features = ["common-password"]

[dev-dependencies.testcontainers-modules]
version = "0.15.0"
features = ["postgres", "blocking"]
