name: Build and test backend
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ main ]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - run: sudo apt-get install -y libpq-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup update ${{ matrix.toolchain }} && rustup component add rustfmt --toolchain ${{ matrix.toolchain }}
      - run: cargo +${{ matrix.toolchain }} build --verbose
        working-directory: adventskalender-backend
      - run: cargo +${{ matrix.toolchain }} fmt --all -- --check
        if: matrix.toolchain == 'stable'
        working-directory: adventskalender-backend
      - run: cargo +${{ matrix.toolchain }} test --verbose
        working-directory: adventskalender-backend
