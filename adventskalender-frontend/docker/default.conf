# $proxy_add_x_forwarded_for would append the client IP resolved by the realip module instead of the direct peer
map $http_x_forwarded_for $forwarded_for_chain {
    ""      $realip_remote_addr;
    default "$http_x_forwarded_for, $realip_remote_addr";
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root /usr/share/nginx/html;
    server_tokens off;

    # The outer TLS reverse proxy is the direct peer; take the client IP from its X-Forwarded-For header
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # proxy API requests to the backend container
    location /api/ {
        proxy_pass http://adventskalender_backend:5479/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # proxy the OpenID configuration and the JWKS of the backend to the backend container
    location /.well-known/ {
        proxy_pass http://adventskalender_backend:5479/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed file names, so these never change
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /images/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # unknown paths are client-side routes of React Router and get the SPA entry point
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        include /etc/nginx/snippets/security-headers.conf;
    }
}
